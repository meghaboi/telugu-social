name: API Deploy Azure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/api-deploy-azure.yml"

concurrency:
  group: api-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm --workspace @telugu-social/api run test

      - name: Build API
        run: npm --workspace @telugu-social/api run build

      - name: Prepare deploy package
        run: |
          mkdir -p deploy/api
          cp apps/api/package.json deploy/api/package.json
          cp -r apps/api/dist deploy/api/dist

      - name: Install prod dependencies
        run: npm install --omit=dev
        working-directory: deploy/api

      - name: Zip artifact
        run: |
          cd deploy/api
          zip -r ../api-release.zip .

      - name: Deploy to Azure ZipDeploy
        shell: bash
        env:
          AZURE_API_PUBLISH_PROFILE: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
        run: |
          if [ -z "$AZURE_API_PUBLISH_PROFILE" ]; then
            echo "AZURE_API_PUBLISH_PROFILE secret is missing"
            exit 1
          fi

          echo "$AZURE_API_PUBLISH_PROFILE" > publish-profile.xml

          ZIP_PROFILE=$(grep -o 'publishMethod="ZipDeploy"[^>]*' publish-profile.xml || true)
          if [ -z "$ZIP_PROFILE" ]; then
            echo "ZipDeploy profile not found in publish profile XML"
            exit 1
          fi

          PUBLISH_URL=$(echo "$ZIP_PROFILE" | sed -E 's/.*publishUrl="([^"]+)".*/\1/')
          USERNAME=$(echo "$ZIP_PROFILE" | sed -E 's/.*userName="([^"]+)".*/\1/')
          PASSWORD=$(echo "$ZIP_PROFILE" | sed -E 's/.*userPWD="([^"]+)".*/\1/')

          if [ -z "$PUBLISH_URL" ] || [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "Failed to parse publish profile credentials"
            exit 1
          fi

          if [ "$USERNAME" = "REDACTED" ] || [ "$PASSWORD" = "REDACTED" ]; then
            echo "Publish profile secret appears redacted/invalid. Re-download from Azure Portal for telugusocial-dev-api-1304 and update AZURE_API_PUBLISH_PROFILE."
            exit 1
          fi

          curl -f -X POST "https://${PUBLISH_URL}/api/zipdeploy" \
            -u "${USERNAME}:${PASSWORD}" \
            -H "Content-Type: application/zip" \
            --data-binary "@deploy/api-release.zip"

      - name: Verify deployed health endpoint
        shell: bash
        env:
          AZURE_API_PUBLISH_PROFILE: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
        run: |
          echo "$AZURE_API_PUBLISH_PROFILE" > publish-profile.xml
          ZIP_PROFILE=$(grep -o 'publishMethod="ZipDeploy"[^>]*' publish-profile.xml || true)
          PUBLISH_URL=$(echo "$ZIP_PROFILE" | sed -E 's/.*publishUrl="([^"]+)".*/\1/')
          APP_HOST=$(echo "$PUBLISH_URL" | sed -E 's/\.scm\./\./' | sed -E 's/:.*$//')

          if [ -z "$APP_HOST" ]; then
            echo "Could not derive app host from publish profile"
            exit 1
          fi

          for i in {1..20}; do
            if curl -fsS "https://${APP_HOST}/health" >/dev/null; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed for https://${APP_HOST}/health"
          exit 1
