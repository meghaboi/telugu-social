name: Mobile Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile (preview or production)
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-android-build.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS build Android
        working-directory: apps/mobile
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          if [ -z "$PROFILE" ]; then PROFILE="preview"; fi
          eas build --platform android --profile "$PROFILE" --non-interactive --wait
